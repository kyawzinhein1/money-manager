<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Personal Money Manager - Financial Tracker</title>
    
    <!-- Google Fonts: Plus Jakarta Sans, JetBrains Mono, Noto Sans Myanmar -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- PWA Primary Config -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- iOS Specific PWA Meta Tags (Crucial for Standalone Liquid Mode) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-touch-fullscreen" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Personal Money" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png" />

    <!-- Prevent iOS Standalone Mode from exiting app on internal links -->
    <script>
      (function() {
        if (('standalone' in window.navigator) && window.navigator.standalone) {
          document.addEventListener('click', function(e) {
            var node = e.target;
            while (node && node.nodeName !== 'A') {
              node = node.parentNode;
            }
            if (node && node.nodeName === 'A' && node.getAttribute('href')) {
              var href = node.getAttribute('href');
              if (href && href.indexOf('http') !== 0 && href.indexOf('mailto:') !== 0 && href.indexOf('tel:') !== 0) {
                e.preventDefault();
                window.location.href = href;
              }
            }
          }, false);
        }
      })();
    </script>
    <style>
      /* Zero white screen fallback container styling */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: #09090b;
        color: #ffffff;
      }
      #root:empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #09090b;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #root:empty::before {
        content: "";
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #007aff, #30b0ff);
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 122, 255, 0.4);
        margin-bottom: 20px;
        background-image: url('/icon-192.png');
        background-size: cover;
        background-position: center;
        animation: pulseLogo 1.8s ease-in-out infinite alternate;
      }
      #root:empty::after {
        content: "Money Manager";
        font-size: 18px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #f4f4f5;
      }
      @keyframes pulseLogo {
        0% { transform: scale(0.96); opacity: 0.85; }
        100% { transform: scale(1.04); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
